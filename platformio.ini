[platformio]
default_envs = esp32-cyd-28r
description = ESP32 CYD Auto Dashboard - Multi-Variant Bluetooth OBD-II Gauge Cluster

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

common_build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D USE_HSPI_PORT=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    powerbroker2/ELMduino@^3.0.3

# =============================================================================
# 1. Standard 2.8" CYD Resistive (ESP32-2432S028R - Single Micro-USB)
# =============================================================================
[env:esp32-cyd-28r]
build_flags =
    ${env.common_build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

# =============================================================================
# 2. 2.8" CYD 2-USB Variant (ESP32-2432S028 - ST7789 Display Controller)
# =============================================================================
[env:esp32-cyd-28-2usb]
build_flags =
    ${env.common_build_flags}
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

# =============================================================================
# 3. 2.4" CYD Variant (ESP32-2432S024R)
# =============================================================================
[env:esp32-cyd-24r]
build_flags =
    ${env.common_build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000

# =============================================================================
# 4. 3.2" CYD Variant (ESP32-2432S032R)
# =============================================================================
[env:esp32-cyd-32r]
build_flags =
    ${env.common_build_flags}
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=55000000

# =============================================================================
# 5. 3.5" CYD Variant (ESP32-3248S035R - ST7796 480x320)
# =============================================================================
[env:esp32-cyd-35r]
build_flags =
    ${env.common_build_flags}
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
